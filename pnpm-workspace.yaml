# pnpm 11+ build-script approvals (no longer read from package.json's "pnpm" field).
# esbuild ships a prebuilt platform binary and needs its install script to run.
allowBuilds:
  esbuild: true
  msw: false
# Keep hidden input aligned when history is cleared or a TUI switches screens.
# Upstream: https://github.com/vercel-labs/wterm/issues/245 (still open in 0.6.0).
# Give Powerline and Nerd Font cells a class so terminal.css can size or draw them.
patchedDependencies:
  '@wterm/dom@0.6.0': patches/@wterm__dom@0.6.0.patch
