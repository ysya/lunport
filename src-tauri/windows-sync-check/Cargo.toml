[package]
name = "lunport-windows-sync-check"
version = "0.1.0"
edition = "2021"
publish = false

# The same versions already locked by the desktop app. This isolated probe avoids
# rebuilding Tauri to exercise actual Windows handle/ACL semantics.
[dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }
zeroize = "=1.9.1"

[dev-dependencies]
tempfile = "=3.27.0"
