[package]
name = "sshelter"
version = "0.16.0"
description = "SSHelter — a cross-platform desktop manager for your local OpenSSH config, keys, agent, and known_hosts."
authors = ["Frank Sung"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sshelter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
tempfile = "3"
glob = "0.3"
shellexpand = "3"
dirs = "5"
keyring = "4.1.5"
getrandom = "0.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"
bip39 = { version = "2", features = ["rand"] }
hkdf = "0.12"
hmac = "0.12"
chacha20poly1305 = "0.10"
zeroize = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
# 金鑰保管庫(src/vault/material.rs):解析、解密 OpenSSH 私鑰並簽章。ssh-key 0.6.7 的 RSA 簽章有錯,RSA 改用 rsa 套件;
# rsa::pkcs1v15::SigningKey 需要摘要演算法的 OID,所以 sha2、sha1 都開 oid。ssh-encoding 必須是 0.2(0.3 屬於 ssh-key 0.7 預覽版,與 0.6.7 不相容)。
ssh-key = { version = "0.6.7", features = ["crypto", "encryption"] }
ssh-encoding = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
rand_core = { version = "0.6", features = ["getrandom"] }
signature = "2"

[dev-dependencies]
ts-rs = "10"
mockito = "1"

# Desktop-only plugins (autostart and global shortcuts have no mobile support).
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"

# SP3 金鑰插槽:Windows 上把插槽目錄與私鑰設成只有目前使用者能存取(src/sync/slot_files_windows.rs)。
# 0.61 已在 Cargo.lock(tempfile 等的相依),不需下載。Win32_Storage_FileSystem 與 Win32_System_SystemServices 只為了
# FILE_ALL_ACCESS 與 SECURITY_DESCRIPTOR_REVISION 兩個常數。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }
