[package]
name = "sshelter"
version = "1.10.2"
description = "Lunport — your SSH workspace for hosts, keys, Groups and encrypted library sync."
authors = ["Frank Sung"]
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sshelter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
development-profile = []
default = ["central-sync"]
central-sync = []
# Compatibility for scripts that explicitly enabled earlier preview builds.
central-sync-preview = ["central-sync"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Preserve comments and unknown settings when adding the user-selected Codex MCP entry.
# Already present in the lockfile through tauri-build.
toml_edit = "=0.25.12"
thiserror = "2"
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
tempfile = "3"
glob = "0.3"
shellexpand = "3"
dirs = "5"
keyring = "4.1.5"
getrandom = "0.3"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-clipboard-manager = "2"
bip39 = { version = "2", features = ["rand", "zeroize"] }
hkdf = "0.12"
# Native one-time fallback unlock; reuse the existing locked Argon2 implementation.
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
hmac = "0.12"
chacha20poly1305 = "0.10"
# Central sync: independent device signatures and RFC 9180 key wrapping.
ed25519-dalek = "3.0"
hpke = { version = "0.14", default-features = false, features = ["alloc", "getrandom", "chacha", "x25519"] }
# Native browser OIDC; HTTP is supplied by our bounded, no-redirect adapter.
openidconnect = { version = "4.0", default-features = false, features = ["timing-resistant-secret-traits"] }
# Local OAuth callback: use the existing Hyper parser, with bounded HTTP/1 connections.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
zeroize = "1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
# 金鑰保管庫(src/vault/material.rs):解析、解密 OpenSSH 私鑰並簽章。ssh-key 0.6.7 的 RSA 簽章有錯,RSA 改用 rsa 套件;
# rsa::pkcs1v15::SigningKey 需要摘要演算法的 OID,所以 sha2、sha1 都開 oid。ssh-encoding 必須是 0.2(0.3 屬於 ssh-key 0.7 預覽版,與 0.6.7 不相容)。
# 0.6.7 也讀不懂純量短了的 ECDSA 私鑰(OpenSSH 省掉 mpint 的前導零),src/vault/short_scalar.rs 補零;0.7.0-rc.11 只修了 P-384、P-521。
ssh-key = { version = "0.6.7", features = ["crypto", "encryption"] }
ssh-encoding = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
sha1 = { version = "0.10", features = ["oid"] }
rand_core = { version = "0.6", features = ["getrandom"] }
signature = "2"
# SSH engine (src/ssh/): russh is imported by src/ssh/russh_engine.rs only. Pinned to the exact version the phase-0 spike measured.
russh = "=0.64.1"
# russh runs on tokio. The engine owns a dedicated runtime (rt-multi-thread, net, time) and drives it with block_on; `macros` is for select!.
# `signal`: `sshelter connect` follows the terminal's size (SIGWINCH), stops cleanly on SIGINT, SIGTERM, SIGHUP and SIGQUIT, and puts the
# terminal back for Ctrl-Z (SIGTSTP) and sets it again when it continues (SIGCONT) (src/cli/run.rs).
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

[dev-dependencies]
ts-rs = "10"
mockito = "1"

# Desktop-only plugins (autostart and global shortcuts have no mobile support).
# single-instance: a second launch hands its arguments to the running Lunport and exits (lib.rs).
# `~2.4.5` on purpose: 2.5.x requires tauri 2.12, and a caret requirement makes cargo upgrade tauri
# (and its runtime crates) past the 2.11 that @tauri-apps/api is on. Move both to 2.12 together.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2.10.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "~2.4.5"

# SP3 金鑰插槽:Windows 上把插槽目錄與私鑰設成只有目前使用者能存取(src/sync/slot_files_windows.rs)。
# 0.61 已在 Cargo.lock(tempfile 等的相依),不需下載。Win32_Storage_FileSystem 與 Win32_System_SystemServices 只為了
# FILE_ALL_ACCESS 與 SECURITY_DESCRIPTOR_REVISION 兩個常數。
# 金鑰保管庫的 agent 認出連上來的程式(src/agent/peer.rs):Win32_System_Diagnostics_ToolHelp 給程序快照(找父程序),
# 程序的執行檔路徑用 Win32_System_Threading 的 QueryFullProcessImageNameW。
# agent 的 named pipe(src/agent/pipe_windows.rs):Win32_System_Pipes 給 CreateNamedPipeW、ConnectNamedPipe 與 GetNamedPipeClientProcessId,
# ConnectNamedPipe 的參數含 OVERLAPPED 指標,windows-sys 把它放在 Win32_System_IO 後面。
# `sshelter connect`'s console (src/cli/terminal_windows.rs): Win32_System_Console for the console's modes, code pages, window size and
# input buffer.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ErrorReporting", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# 金鑰保管庫的 agent 認出連上來的程式(src/agent/peer.rs):macOS 用 libc 的 proc_pidinfo、proc_pidpath 與 sysctl(KERN_PROCARGS2);
# Linux 只讀 /proc。libc 已在 Cargo.lock(其他套件的相依),不需下載。
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Use only unlocked Secret Service items in background; the high-level keyring backend auto-prompts.
# This exact version is already in Cargo.lock through keyring.
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "=5.1.0", features = ["rt-tokio-crypto-rust"] }

# keyring's attributes API reads the password on macOS. Query native metadata instead.
# This is the same Security.framework version already used by keyring.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "=3.7.0"
plist = "=1.9.0"

# 在 debug 建置裡產生 RSA 金鑰(vault::generate)要好幾分鐘;只替大數運算的套件開最佳化就降到幾秒(rsa 套件的 README 也這樣建議)。
# release 建置不受影響。
[profile.dev.package.num-bigint-dig]
opt-level = 3

# Keep the 2.11 API/bundler contracts while fixing Context/AppHandle ownership.
# See vendor/tauri-runtime-wry/LUNPORT_PATCH.md for provenance and regression evidence.
[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }

# Signature verification runs under real synchronization deadlines in isolated tests.
# Optimize the existing curve implementation as for RSA above; release builds are unchanged.
[profile.dev.package.curve25519-dalek]
opt-level = 3

# Migration validates and clears complete encrypted historical snapshots under the
# same real deadlines as release builds. Keep these existing crypto primitives
# optimized in development as well, without changing requests or timeout limits.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3
[profile.dev.package.zeroize]
opt-level = 3

# Capacity-test sampling spends its time decoding OpenSSH PEM/base64. These
# existing parsers must keep their real validation; optimize them as above
# instead of shrinking migration fixtures. Production builds are unchanged.
[profile.dev.package.ssh-key]
opt-level = 3
[profile.dev.package.ssh-encoding]
opt-level = 3
[profile.dev.package.pem-rfc7468]
opt-level = 3
[profile.dev.package.base64ct]
opt-level = 3

# Keep the fixed-memory fallback KDF practical in debug builds as well.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
