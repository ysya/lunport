# Runs the platform-dependent tests on Windows: the key slots' hard links and owner-only DACL (SP3 Task 2), and the key
# vault and SSH agent tests (the agent's named pipe and its owner-only DACL, Windows program identification, and the real
# Win32-OpenSSH tools against the agent). The copy fallback (used when a hard link can't be made, for example across
# drives) is not exercised on CI.
# macOS can only type-check the Windows code; the permission behavior has to be seen on Windows.
name: windows key slots

on:
  push:
    branches: [main]
    paths: ["src-tauri/**", ".github/workflows/test-windows.yml"]
  pull_request:
    paths: ["src-tauri/**", ".github/workflows/test-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slots:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # tauri::generate_context! reads frontendDist (../dist) at compile time and fails when it is missing.
      # This job only runs Rust tests, so a placeholder page is enough.
      - name: Placeholder frontend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Set-Content -Path ../dist/index.html -Value "<!doctype html>"
      # Which OpenSSH the agent tests will use (the Win32-OpenSSH in System32 when it exists, else the first one on PATH). Never fails the job.
      - name: OpenSSH on the runner
        continue-on-error: true
        run: |
          Get-Command ssh, ssh-add, ssh-keygen -All -ErrorAction SilentlyContinue | Format-Table Name, Source -AutoSize
          ssh -V
      # The platform-dependent tests: identity path parsing (slot_rules), the slot files, links and DACL (slot_files,
      # slot_files_windows), the key vault (vault::) and the SSH agent (agent:: covers the named pipe, program identification and
      # the real ssh-add / ssh-keygen against the agent). The rest of the suite runs on macOS; parts of it use the system keychain.
      - name: Key slot, vault and agent tests
        env:
          SSHELTER_REQUIRE_OPENSSH: "1"
        # Quoted: an unquoted `vault:: agent::` is read as a YAML mapping and the workflow would not load.
        run: "cargo test --lib -- sync::slot_rules sync::slot_files vault:: agent::"
