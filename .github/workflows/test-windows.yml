name: Windows native tray investigation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  slots:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Placeholder frontend
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          Set-Content -Path ../dist/index.html -Value '<!doctype html><title>Native test only</title>'
      - name: Repeat isolated native tray test and capture native-fault stacks
        timeout-minutes: 12
        run: |
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            Write-Output "Diagnostic native tray attempt $attempt/30"
            cargo test --locked --lib -- --ignored --exact sync::engine::windows_tests::synced_library_startup_and_concurrent_tray_updates --nocapture
            if ($LASTEXITCODE -ne 0) { throw "native tray attempt $attempt failed (exit $LASTEXITCODE)" }
          }
