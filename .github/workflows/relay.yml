name: CI - Relay

on:
  pull_request:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:security-config
      - run: npm run test:security-config
      - run: npm test

  central-selfhost:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Build independent application and security images
        run: |
          docker build -f relay/selfhost/central/Dockerfile --target core-bundle -t lunport-central-core:local relay
          docker build -f relay/selfhost/central/Dockerfile --target security-runtime -t lunport-central-security:local relay
      - name: Verify private provisioning, proxy boundary, persistence and floor enforcement
        run: node relay/selfhost/central/smoke-test.mjs
