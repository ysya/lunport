# Runs the tests of the SSH engine (src-tauri/src/ssh/) and of what uses it (the session broker, src-tauri/src/session/; sshelter
# connect, src-tauri/src/cli/; starting the app for its clients, host_start) where they can run for real: against a scratch OpenSSH
# server on macOS and on Linux, and on Linux also against a real OpenSSH with PAM in a container (the logins by password and by
# keyboard-interactive, which a scratch sshd cannot check). The Windows leg lives in test-windows.yml.
#
# aws-lc-sys (russh's crypto, the same crate rustls already pulls in for the updater) is built by its build script with the runner's C
# compiler: clang on macOS, gcc on ubuntu-24.04. The release workflow already builds it on both through rustls, so nothing is installed
# for it here.
name: CI - App

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# PRs are checked before merge; merging does not repeat the same full suites.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  changes:
    name: Policy, versions and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.select.outputs.frontend }}
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: node --test scripts/ci-changes.test-node.mjs
      - name: Select checks and verify version consistency
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs
      - name: Lint all application workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint:1.7.12 -shellcheck='' -color

  frontend:
    name: Frontend tests and build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build

  macos:
    name: Rust and SSH (macOS)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      # tauri::generate_context! reads frontendDist (../dist) at compile time and fails when it is missing.
      # This job only runs Rust tests, so a placeholder page is enough.
      - name: Placeholder frontend
        run: |
          mkdir -p ../dist
          echo '<!doctype html>' > ../dist/index.html
      # Which OpenSSH the scratch servers will be. Never fails the job.
      - name: OpenSSH on the runner
        continue-on-error: true
        run: |
          ls -l /usr/sbin/sshd
          ssh -V
      # SSHELTER_REQUIRE_OPENSSH=1: a missing sshd is a failure here, not a skipped test.
      - name: Complete safe Rust suite
        env:
          SSHELTER_REQUIRE_OPENSSH: "1"
        # CLI tests exercise process-group signals. Isolate their session from the Actions worker
        # and retain a bounded diagnostic if a runner stops making progress.
        run: |
          python3 - <<'PY'
          import subprocess
          command = [
              "cargo", "test", "--locked", "--lib", "--",
              "--skip", "secrets::tests::round_trip_set_get_delete",
              "--skip", "askpass::tests::env_secret_takes_priority_over_keychain",
              "--skip", "askpass::tests::missing_account_and_no_env_yields_none",
              "--skip", "ssh::engine_tests::login_methods::pam",
          ]
          try:
              subprocess.run(command, check=True, start_new_session=True, timeout=900)
          except subprocess.TimeoutExpired:
              subprocess.run(["ps", "-axo", "pid,ppid,pgid,state,etime,comm"], check=False)
              raise
          PY

      - name: Profile selection in the normal library
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          cargo test --locked --test app_profile_build
          cargo test --locked --release --test app_profile_build
          cargo test --locked --release --features development-profile --test app_profile_build

  linux:
    name: Rust, SSH and PAM (Linux)
    needs: changes
    if: needs.changes.outputs.native == 'true'
    # Not ubuntu-latest: the PAM image is ubuntu:24.04, and the package names below were checked against 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v7
      # The packages release.yml installs to build the app on Linux, and openssh-server for the scratch sshd (/usr/sbin/sshd).
      - name: Install system packages
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils openssh-server
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Placeholder frontend
        run: |
          mkdir -p ../dist
          echo '<!doctype html>' > ../dist/index.html
      - name: OpenSSH on the runner
        continue-on-error: true
        run: |
          ls -l /usr/sbin/sshd
          ssh -V
      # A random password for the test user, masked in the log, passed to the tests through the environment of the later steps.
      - name: Start OpenSSH with PAM in a container
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          docker build --build-arg TEST_PASSWORD="$password" -t sshelter-pam-sshd tests/pam-sshd
          docker run -d --name sshelter-pam-sshd -p 127.0.0.1:2222:22 sshelter-pam-sshd
          for _ in $(seq 1 30); do
            ssh-keyscan -T 2 -p 2222 127.0.0.1 > /dev/null 2>&1 && break
            sleep 1
          done
          ssh-keyscan -T 2 -p 2222 127.0.0.1 > /dev/null
          echo "SSHELTER_PAM_PASSWORD=$password" >> "$GITHUB_ENV"
      # The pam tests are skipped here: the next step runs them against the container.
      - name: Complete safe Rust suite against a scratch sshd
        # Runs even when the container did not start, so that a first run shows both results.
        if: ${{ !cancelled() }}
        env:
          SSHELTER_REQUIRE_OPENSSH: "1"
        # Quoted: an unquoted `ssh::` is read as a YAML mapping and the workflow would not load.
        run: "cargo test --locked --lib -- --skip secrets::tests::round_trip_set_get_delete --skip askpass::tests::env_secret_takes_priority_over_keychain --skip askpass::tests::missing_account_and_no_env_yields_none --skip ssh::engine_tests::login_methods::pam"

      - name: Profile selection in the normal library
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
          CARGO_PROFILE_RELEASE_LTO: "false"
        run: |
          cargo test --locked --test app_profile_build
          cargo test --locked --release --test app_profile_build
          cargo test --locked --release --features development-profile --test app_profile_build
      - name: Group ordering remains compatible with the published 1.2.0 client
        run: |
          git fetch --depth=1 origin tag v1.2.0
          bash ../scripts/validate-group-order-compat.sh
      # Runs whatever the scratch sshd step came to, so that a first run shows both results.
      - name: Password and keyboard-interactive tests against the container
        if: ${{ !cancelled() }}
        env:
          SSHELTER_REQUIRE_OPENSSH: "1"
          SSHELTER_REQUIRE_PAM: "1"
          SSHELTER_PAM_PORT: "2222"
          SSHELTER_PAM_USER: sshelter
        # Quoted: an unquoted `ssh::` is read as a YAML mapping and the workflow would not load.
        run: "cargo test --locked --lib -- ssh::engine_tests::login_methods::pam"
      - name: What the container logged
        if: failure()
        run: docker logs sshelter-pam-sshd || true
