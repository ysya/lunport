name: release

# How releasing works:
#  1. Every push to `main` runs release-please, which opens/updates a "release" PR that bumps
#     the version across package.json + src-tauri/Cargo.toml + src-tauri/tauri.conf.json and
#     regenerates CHANGELOG.md from Conventional Commits. (Reviewing/merging that PR is the gate.)
#  2. Merging the release PR makes release-please create the GitHub Release + git tag.
#  3. That gates the `build` job (same workflow — so it isn't blocked by the GITHUB_TOKEN
#     "don't trigger other workflows" rule), which compiles installers on each platform and
#     uploads them to the release created in step 2.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE universal mac leg (Intel + Apple Silicon in a single binary). Two separate mac
          # legs finished near-simultaneously and raced each other updating latest.json on the
          # release (delete-asset 404) — one leg can't race itself. The updater falls back to
          # the `darwin-universal` key when `darwin-{arch}` is absent.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04 # Linux x86_64
            args: ""
          - platform: ubuntu-22.04-arm # Linux arm64 (free on public repos)
            args: ""
          - platform: windows-latest # Windows x86_64 (NSIS installer)
            # Bundles sshelter-cli.exe (step "Build the console helper") next to sshelter.exe.
            args: --config '{"bundle":{"externalBin":["binaries/sshelter-cli"]}}'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler needs xdg-open; the arm64 runner image lacks it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # sshelter-cli.exe (src-tauri/cli-helper, std only): the console program a Windows terminal runs for Connect, which runs
      # sshelter.exe (a GUI program) and waits for it (own-ssh spec §7.3). The Windows leg's --config adds it to bundle.externalBin:
      # tauri build takes it from src-tauri/binaries under the target triple's name and installs it next to sshelter.exe. Plain cargo
      # builds never look for it. The C runtime is linked in (+crt-static), as tauri build does for sshelter.exe (STATIC_VCRUNTIME): the
      # installer carries no VC++ runtime.
      - name: Build the console helper (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --manifest-path src-tauri/cli-helper/Cargo.toml
          mkdir -p src-tauri/binaries
          cp src-tauri/cli-helper/target/release/sshelter-cli.exe src-tauri/binaries/sshelter-cli-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: pnpm install

      # Two supported modes: with the repository variable set, releases ship a built-in sync relay;
      # without it, users who want sync enter their own relay URL in Settings → Sync. A value that is
      # set but not https:// would ship a default the app itself rejects, so that fails the build.
      - name: Check the sync relay URL
        shell: bash
        env:
          SSHELTER_RELAY_URL: ${{ vars.SSHELTER_RELAY_URL }}
        run: |
          if [ -z "$SSHELTER_RELAY_URL" ]; then
            echo "::notice::SSHELTER_RELAY_URL is not set: this release has no built-in sync relay (users enter one in Settings → Sync)."
          elif [[ "$SSHELTER_RELAY_URL" != https://* ]]; then
            echo "::error::SSHELTER_RELAY_URL must start with https:// (got '$SSHELTER_RELAY_URL')."
            exit 1
          fi

      - name: Build and upload installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign). The key has no password; the
          # empty PASSWORD var keeps the CLI from prompting interactively.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Built-in sync relay URL (repository variable; https:// only, checked above). When unset, the release has no built-in relay.
          SSHELTER_RELAY_URL: ${{ vars.SSHELTER_RELAY_URL }}
        with:
          # The release already exists (created by release-please); attach assets to it by tag.
          tagName: ${{ needs.release-please.outputs.tag_name }}
          args: ${{ matrix.args }}

  beta-manifest:
    # Offer this release on the Beta update channel too, unless the channel already points at a
    # newer beta (scripts/beta-channel.mjs). Runs after every platform uploaded its artifacts, so
    # the release's latest.json is complete; skipped when any build leg failed.
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with beta.yml: manifest updates queue instead of racing.
    concurrency:
      group: updater-beta-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Update the Beta channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: node scripts/beta-channel.mjs update-manifest "$TAG_NAME"
