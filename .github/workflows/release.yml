name: Release - Stable

# How releasing works:
#  1. Every push to `main` runs release-please, which opens/updates a "release" PR that bumps
#     the version across package.json + src-tauri/Cargo.toml + src-tauri/tauri.conf.json and
#     regenerates CHANGELOG.md from Conventional Commits. (Reviewing/merging that PR is the gate.)
#  2. Merging the release PR makes release-please create the GitHub Release + git tag.
#  3. That gates the `build` job (same workflow — so it isn't blocked by the GITHUB_TOKEN
#     "don't trigger other workflows" rule), which compiles installers on each platform and
#     uploads them to the release created in step 2.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE universal mac leg (Intel + Apple Silicon in a single binary). Two separate mac
          # legs finished near-simultaneously and raced each other updating latest.json on the
          # release (delete-asset 404) — one leg can't race itself. The updater falls back to
          # the `darwin-universal` key when `darwin-{arch}` is absent.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-26.04 # Linux x86_64
            args: ""
          - platform: ubuntu-26.04-arm # Linux arm64 (free on public repos)
            args: ""
          - platform: windows-latest # Windows x86_64 (NSIS installer)
            # The step "Build the console helper" adds the argument that bundles the helper.
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler needs xdg-open; the arm64 runner image lacks it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The console helper a Windows terminal runs for Connect: scripts/windows-console-helper.mjs builds it and puts it where tauri build
      # bundles it from (its header says why it is built this way). The step's output `args` is what the Windows leg adds to tauri build.
      - name: Build the console helper (Windows)
        id: helper
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        run: node scripts/windows-console-helper.mjs

      - name: Install frontend dependencies
        run: pnpm install

      - name: Prepare the fixed macOS signing identity
        if: startsWith(matrix.platform, 'macos')
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare

      # Supplying releaseId makes tauri-action upload without editing existing release notes.
      - name: Locate the existing release
        id: target-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.id')"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Build and upload installers to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign). The key has no password; the
          # empty PASSWORD var keeps the CLI from prompting interactively.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Public installers ask users for their own deployed server.
          LUNPORT_RELAY_URL: ""
        with:
          # The release already exists (created by release-please); upload assets by ID without editing its metadata.
          releaseId: ${{ steps.target-release.outputs.id }}
          tagName: ${{ needs.release-please.outputs.tag_name }}
          # The wrapper verifies the App and updater archive before the action uploads them.
          tauriScript: ${{ startsWith(matrix.platform, 'macos') && 'bash scripts/build-macos-release.sh' || '' }}
          args: ${{ matrix.args }} ${{ steps.helper.outputs.args }}

      - name: Remove the temporary macOS signing keychain
        if: always() && startsWith(matrix.platform, 'macos')
        run: bash scripts/macos-signing.sh cleanup

  beta-manifest:
    # Offer this release on the Beta update channel too, unless the channel already points at a
    # newer beta (scripts/beta-channel.mjs). Runs after every platform uploaded its artifacts, so
    # the release's latest.json is complete; skipped when any build leg failed.
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with beta.yml: manifest updates queue instead of racing.
    concurrency:
      group: updater-beta-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Update the Beta channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: node scripts/beta-channel.mjs update-manifest "$TAG_NAME"
