name: release

# Push a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build
# installers on every platform and create a DRAFT GitHub Release with the assets.
# (`workflow_dispatch` lets you trigger a build manually for testing.)
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest" # Apple Silicon (M-series)
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest" # Intel
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04" # Linux x86_64
            args: ""
          - platform: "ubuntu-22.04-arm" # Linux arm64 (free on public repos)
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "pnpm"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # macOS runners build both arches; skipped elsewhere to speed up the build.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tauri-action replaces __VERSION__ with the app version from tauri.conf.json.
          tagName: v__VERSION__
          releaseName: "SSHelter v__VERSION__"
          releaseBody: |
            Download the installer for your platform from the assets below.

            > macOS builds are **unsigned** for now — on first launch, right-click the app and choose **Open** (or System Settings → Privacy & Security → Open Anyway). Notarized/signed builds will come later.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
