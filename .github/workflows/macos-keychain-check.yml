name: CI - macOS credentials
on:
  pull_request:
    paths: ["scripts/*macos*", "scripts/ci-changes*.mjs", "src-tauri/signing/**", "!src-tauri/signing/**/*.md", "src-tauri/src/macos_credential*", "src-tauri/src/secrets.rs", "src-tauri/build.rs", "src-tauri/Cargo.toml", "src-tauri/Cargo.lock", ".github/workflows/macos-keychain-check.yml", ".github/workflows/release.yml", ".github/workflows/beta.yml"]
  workflow_dispatch:
    inputs:
      identity_only:
        description: Run only the disposable Keychain authorization probes
        type: boolean
        default: false
      freeze_helper:
        description: Generate a signed fixed-helper candidate artifact for review (never publishes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}-${{ inputs.freeze_helper || false }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select credential checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      credentials: ${{ steps.select.outputs.credentials }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs

  helper-rust:
    name: Frozen helper and Rust transport
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && inputs.identity_only != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Placeholder frontend for the native metadata probe
        run: |
          mkdir -p dist
          echo '<!doctype html>' > dist/index.html
      - name: Native metadata in a disposable keychain
        run: bash scripts/validate-macos-keychain.sh --with-rust
      - name: Prepare the pinned signing identity
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare
      - name: Verify exact frozen artifact with two production-signed client builds
        run: bash scripts/validate-macos-frozen-helper.sh src-tauri/signing
      - name: Exercise production Rust transport, installer and recovery against the frozen helper
        run: bash scripts/validate-macos-helper-rust.sh
      - name: Remove the temporary signing keychain
        if: always()
        run: bash scripts/macos-signing.sh cleanup

  helper:
    name: Helper authorization protocol
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && inputs.identity_only != true
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise immutable helper, one-time migration and client authorization
        run: bash scripts/validate-macos-helper.sh

  helper-candidate:
    name: Generate helper candidate (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.freeze_helper == true
    needs: helper
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prepare the pinned project signing identity
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare
      - name: Build a frozen universal helper candidate
        run: bash scripts/build-macos-credential-helper.sh
      - name: Verify the exact signed production helper with both client builds
        run: bash scripts/validate-macos-frozen-helper.sh "$RUNNER_TEMP/lunport-credential-helper-v1-candidate"
      - uses: actions/upload-artifact@v7
        with:
          archive: true
          name: lunport-credential-helper-v1-candidate
          path: ${{ runner.temp }}/lunport-credential-helper-v1-candidate/
          if-no-files-found: error
      - name: Remove the temporary signing keychain
        if: always()
        run: bash scripts/macos-signing.sh cleanup

  identity:
    name: Keychain partition regression
    # The full helper job already includes this probe with the Rust metadata test.
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && (inputs.identity_only == true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Upgrade between differently built executables with a stable signer
        run: bash scripts/validate-macos-keychain.sh

  signed-bundle:
    name: Signed universal app and updater
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && inputs.identity_only != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare the fixed macOS signing identity
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare
      - name: Exercise the production verifier before the full build
        run: bash scripts/validate-macos-signing.sh
      - name: Build and verify the actual release bundles without publishing
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target universal-apple-darwin
          tauriScript: bash scripts/build-macos-release.sh
      - name: Remove the temporary macOS signing keychain
        if: always()
        run: bash scripts/macos-signing.sh cleanup
