name: macOS Keychain identity
on:
  push:
    branches: [codex/keychain-update-trust]
    paths: ["scripts/macos-keychain-probe.c", "scripts/validate-macos-keychain.sh", ".github/workflows/macos-keychain-check.yml"]
  pull_request:
    paths: ["scripts/macos-keychain-probe.c", "scripts/validate-macos-keychain.sh", ".github/workflows/macos-keychain-check.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  identity:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade between differently built executables with a stable signer
        run: bash scripts/validate-macos-keychain.sh
