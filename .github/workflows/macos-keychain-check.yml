name: CI - macOS credentials
on:
  pull_request:
  workflow_dispatch:
    inputs:
      identity_only:
        description: Run only the disposable Keychain authorization probes
        type: boolean
        default: false
      freeze_helper:
        description: Generate a signed helper v2 candidate artifact for review (never publishes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name }}-${{ inputs.freeze_helper || false }}
  cancel-in-progress: true
jobs:
  changes:
    name: Select credential checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      credentials: ${{ steps.select.outputs.credentials }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs

  helper-rust:
    name: Frozen helper and Rust transport
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && inputs.identity_only != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The scripts below read identity values through scripts/identity.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - name: Placeholder frontend for the Rust test build
        run: |
          mkdir -p dist
          echo '<!doctype html>' > dist/index.html
      - name: Native metadata in a disposable keychain
        run: bash scripts/validate-macos-keychain.sh
      - name: Prepare the pinned signing identity
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare
      # Helper v1 accepts only a parent signed with the previous certificate, which only the bridge is signed with, so both are verified
      # by their bytes, source and signature alone. They pass whatever helper v2's state.
      - name: Verify the frozen helper v1
        run: python3 scripts/verify-macos-credential-helper.py
      - name: Verify the frozen credential bridge
        run: python3 src-tauri/signing/legacy/verify-credential-bridge.py
      # The credential migration's chain as the app runs it: its Rust session, the frozen bridge and the frozen helper v1.
      - name: Exercise the Rust bridge session against the frozen bridge and helper v1
        run: bash scripts/validate-macos-helper-rust.sh bridge
      # Helper v2 keeps Production credentials.
      - name: Verify the exact frozen helper v2 with two production-signed client builds
        run: bash scripts/validate-macos-frozen-helper.sh v2 src-tauri/signing
      - name: Exercise production Rust transport, installer and recovery against the frozen helper v2
        run: bash scripts/validate-macos-helper-rust.sh
      - name: Remove the temporary signing keychain
        if: always()
        run: bash scripts/macos-signing.sh cleanup

  helper:
    name: Helper authorization protocol
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && inputs.identity_only != true
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The scripts below read identity values through scripts/identity.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Exercise immutable helper, one-time migration and client authorization
        run: bash scripts/validate-macos-helper.sh
      # Fixture builds from source, signed with disposable certificates: the bridge -> helper v1 chain and its refusals, helper v2 and
      # its adopt, in a disposable keychain; on this runner also which program owns the items helper v2 saves, in its login keychain.
      - name: Exercise the credential bridge, helper v2 and adopt
        run: bash scripts/validate-macos-bridge.sh

  helper-candidate:
    name: Generate helper candidate (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.freeze_helper == true
    needs: helper
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      # Helper v1 is frozen with the previous certificate, which this repository no longer holds: only helper v2 can be built here.
      HELPER_VERSION: v2
    steps:
      - uses: actions/checkout@v7
      # The scripts below read identity values through scripts/identity.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Prepare the pinned project signing identity
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare
      # Both architectures, signed with the project certificate, then checked by verify-macos-credential-helper.py --version.
      - name: Build, sign and verify a frozen universal helper candidate
        run: bash scripts/build-macos-credential-helper.sh "$HELPER_VERSION"
      - name: Verify the exact signed production helper with both client builds
        run: bash scripts/validate-macos-frozen-helper.sh "$HELPER_VERSION" "$RUNNER_TEMP/lunport-credential-helper-$HELPER_VERSION-candidate"
      # The candidate: credential-helper-<version>.bin, its manifest .json and the .c it was built from, for review before they are
      # committed.
      - uses: actions/upload-artifact@v7
        with:
          archive: true
          name: lunport-credential-helper-${{ env.HELPER_VERSION }}-candidate
          path: ${{ runner.temp }}/lunport-credential-helper-${{ env.HELPER_VERSION }}-candidate/
          if-no-files-found: error
      - name: Remove the temporary signing keychain
        if: always()
        run: bash scripts/macos-signing.sh cleanup

  identity:
    name: Keychain partition regression
    # The full helper job already includes this probe.
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && (inputs.identity_only == true || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository))
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The script reads identity values through scripts/identity.mjs.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Upgrade between differently built executables with a stable signer
        run: bash scripts/validate-macos-keychain.sh

  signed-bundle:
    name: Signed universal app and updater
    needs: changes
    if: needs.changes.outputs.credentials == 'true' && inputs.identity_only != true && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare the fixed macOS signing identity
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare
      - name: Exercise the production verifier before the full build
        run: bash scripts/validate-macos-signing.sh
      - name: Build and verify the actual release bundles without publishing
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target universal-apple-darwin
          tauriScript: bash scripts/build-macos-release.sh
      - name: Remove the temporary macOS signing keychain
        if: always()
        run: bash scripts/macos-signing.sh cleanup
