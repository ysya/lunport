name: Recovery - Release platform (manual)

# Manual fallback: rebuild ONE platform's installers and attach them to an
# EXISTING release (by tag). Used when a single matrix leg of the release
# workflow fails (e.g. a runner-image quirk) — re-running the original job
# would reuse the old workflow definition, so this builds with current main.
# Stable tags only. Afterwards run "update beta channel" for the same tag: the rebuilt installers
# have new signatures, and this workflow does not refresh the Beta update manifest's copy.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach installers to (e.g. v0.2.0)"
        required: true
      platform:
        description: "Runner platform to build on"
        required: true
        type: choice
        options:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-latest
          - windows-latest
      args:
        description: "Extra tauri build args (e.g. --target aarch64-apple-darwin)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    env:
      # Added to the args of a Windows build that has the console helper, as the Windows leg of release.yml has it: bundles sshelter-cli.exe
      # (step "Build the console helper") next to sshelter.exe. The JSON reaches tauri whole only because it has no backslash and no cmd
      # metacharacter: tauri-action runs pnpm.cmd, that is cmd /d /s /c after cross-spawn's escaping, so it must never get a Windows path or
      # any of % & ^ | < > ( ).
      WINDOWS_HELPER_ARGS: --config '{"bundle":{"externalBin":["binaries/sshelter-cli"]}}'
    steps:
      # Betas have a dash in their tag (vX.Y.Z-N). This workflow builds the tag's commit without
      # the beta version stamp (scripts/set-app-version.mjs, applied by beta.yml only), so its
      # installers would carry the stable version. Fail before anything is built.
      - name: Refuse beta tags
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo '::error::build-platform.yml is for stable tags; re-run the failed job of the "publish beta" run instead.'
            exit 1
          fi

      # Build from the release tag so the artifacts match the released version.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Install Linux dependencies
        if: startsWith(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler needs xdg-open; the arm64 runner image lacks it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(inputs.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The console helper sshelter-cli.exe, as in release.yml (its comment says why it is built this way). A tag from before the helper
      # has no src-tauri/cli-helper: its Windows installers are built as they were then.
      - name: Build the console helper (Windows)
        id: helper
        if: inputs.platform == 'windows-latest' && hashFiles('src-tauri/cli-helper/Cargo.toml') != ''
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --manifest-path src-tauri/cli-helper/Cargo.toml
          mkdir -p src-tauri/binaries
          cp src-tauri/cli-helper/target/release/sshelter-cli.exe src-tauri/binaries/sshelter-cli-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and upload installers to the release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign). The key has no password; the
          # empty PASSWORD var keeps the CLI from prompting interactively.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ inputs.tag }}
          args: ${{ inputs.args }} ${{ steps.helper.outcome == 'success' && env.WINDOWS_HELPER_ARGS || '' }}
