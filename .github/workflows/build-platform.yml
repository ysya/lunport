name: Recovery - Release platform (manual)

# Manual fallback: rebuild ONE platform's installers and attach them to an
# EXISTING release (by tag). Used when a single matrix leg of the release
# workflow fails (e.g. a runner-image quirk) — re-running the original job
# would reuse the old workflow definition, so this builds with current main.
# Stable tags only. Afterwards run "update beta channel" for the same tag: the rebuilt installers
# have new signatures, and this workflow does not refresh the Beta update manifest's copy.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach installers to (e.g. v0.2.0)"
        required: true
      platform:
        description: "Runner platform to build on"
        required: true
        type: choice
        options:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-latest
          - windows-latest
      args:
        description: "Extra tauri build args (e.g. --target aarch64-apple-darwin). On Windows, --target breaks the MSI build: src-tauri/installers/main.wxs includes legacy.wxi by a path relative to target/release/wix/<arch>"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.platform }}
    steps:
      # Betas have a dash in their tag (vX.Y.Z-N). This workflow builds the tag's commit without
      # the beta version stamp (scripts/set-app-version.mjs, applied by beta.yml only), so its
      # installers would carry the stable version. Fail before anything is built.
      - name: Refuse beta tags
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo '::error::build-platform.yml is for stable tags; re-run the failed job of the "publish beta" run instead.'
            exit 1
          fi

      # Build from the release tag so the artifacts match the released version.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # This workflow's own build scripts beside the tag's tree: the tag may be older than they are. They read the names they need from
      # the tree they build. The list is the helper script and the modules it imports (scripts/windows-console-helper.test-node.mjs).
      - name: Check out this workflow's build scripts
        if: inputs.platform == 'windows-latest'
        uses: actions/checkout@v7
        with:
          path: .workflow-scripts
          sparse-checkout: |
            scripts/identity.mjs
            scripts/windows-console-helper.mjs
          sparse-checkout-cone-mode: false

      - name: Install Linux dependencies
        if: startsWith(inputs.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler needs xdg-open; the arm64 runner image lacks it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(inputs.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # The console helper, as in release.yml, by this workflow's script for the tag's tree, under the name the helper has there. A tag
      # from before the helper has no src-tauri/cli-helper: its Windows installers are built as they were then.
      - name: Build the console helper (Windows)
        id: helper
        if: inputs.platform == 'windows-latest' && hashFiles('src-tauri/cli-helper/Cargo.toml') != ''
        shell: bash
        run: node .workflow-scripts/scripts/windows-console-helper.mjs --root .

      - name: Install frontend dependencies
        run: pnpm install

      # Supplying releaseId makes tauri-action upload without editing existing release notes.
      - name: Locate the existing release
        id: target-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.id')"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Build and upload installers to the release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign). The key has no password; the
          # empty PASSWORD var keeps the CLI from prompting interactively.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ steps.target-release.outputs.id }}
          tagName: ${{ inputs.tag }}
          args: ${{ inputs.args }} ${{ steps.helper.outputs.args }}
