name: Release - Beta (manual)

# Publishes a beta for the Beta update channel (Settings → Updates → Release channel):
#  1. `prepare` checks the version (X.Y.Z-N, newer than the current release) and creates the
#     GitHub prerelease v<version> on this commit. Prereleases never become "latest", so the
#     Stable channel (releases/latest/download/latest.json) never offers them.
#  2. `build` stamps the version into the CI workspace only (scripts/set-app-version.mjs; nothing
#     is committed), then builds and uploads the installers on every platform. Keep its steps in
#     sync with the `build` job in release.yml.
#  3. `beta-manifest` points the `updater-beta` release's latest.json at this beta.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Beta version X.Y.Z-N, newer than the current release (e.g. 0.16.1-1)"
        required: true
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/beta-channel.mjs check-version "$VERSION"

      - name: Create the prerelease
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists."
            exit 1
          fi
          # Deleting a release keeps its tag, and `gh release create --target` is ignored for an
          # existing tag: the release would then point at an older commit than this build uses.
          # actions/checkout fetches no tags, so ask the remote. With --exit-code git exits 2 only
          # when no ref matches; any other failure means the check itself failed, so refuse then too.
          # stderr stays visible: git prints nothing on exit 0 or 2 and says why on any other failure.
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag v$VERSION already exists. Delete it (git push --delete origin v$VERSION) or use the next -N."
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "::error::Could not check whether tag v$VERSION exists (git ls-remote exited with $status)."
            exit 1
          fi
          gh release create "v$VERSION" --prerelease --target "$GITHUB_SHA" \
            --title "v$VERSION (beta)" \
            --notes "${NOTES:-Beta build for the Beta update channel (Settings → Updates → Release channel).}"
          echo "tag_name=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ONE universal mac leg (Intel + Apple Silicon in a single binary). Two separate mac
          # legs finished near-simultaneously and raced each other updating latest.json on the
          # release (delete-asset 404) — one leg can't race itself. The updater falls back to
          # the `darwin-universal` key when `darwin-{arch}` is absent.
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04 # Linux x86_64
            args: ""
          - platform: ubuntu-22.04-arm # Linux arm64 (free on public repos)
            args: ""
          - platform: windows-latest # Windows x86_64 (NSIS installer)
            # Bundles sshelter-cli.exe (step "Build the console helper") next to sshelter.exe. The JSON reaches tauri whole only because it
            # has no backslash and no cmd metacharacter: tauri-action runs pnpm.cmd, that is cmd /d /s /c after cross-spawn's escaping, so
            # it must never get a Windows path or any of % & ^ | < > ( ).
            args: --config '{"bundle":{"externalBin":["binaries/sshelter-cli"]}}'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          # xdg-utils: the AppImage bundler needs xdg-open; the arm64 runner image lacks it.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Stamp the beta version (workspace only)
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/set-app-version.mjs "$VERSION"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # sshelter-cli.exe (src-tauri/cli-helper, std only): the console program a Windows terminal runs for Connect, which runs
      # sshelter.exe (a GUI program) and waits for it (own-ssh spec §7.3). The Windows leg's --config adds it to bundle.externalBin:
      # tauri build takes it from src-tauri/binaries under the target triple's name and installs it next to sshelter.exe. Plain cargo
      # builds never look for it. The C runtime is linked in (+crt-static), as tauri build does for sshelter.exe (STATIC_VCRUNTIME): the
      # installer carries no VC++ runtime.
      - name: Build the console helper (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: bash
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build --release --locked --manifest-path src-tauri/cli-helper/Cargo.toml
          mkdir -p src-tauri/binaries
          cp src-tauri/cli-helper/target/release/sshelter-cli.exe src-tauri/binaries/sshelter-cli-x86_64-pc-windows-msvc.exe

      - name: Install frontend dependencies
        run: pnpm install

      - name: Prepare the fixed macOS signing identity
        if: startsWith(matrix.platform, 'macos')
        env:
          LUNPORT_MACOS_CERTIFICATE: ${{ secrets.LUNPORT_MACOS_CERTIFICATE }}
          LUNPORT_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.LUNPORT_MACOS_CERTIFICATE_PASSWORD }}
        run: bash scripts/macos-signing.sh prepare

      # Supplying releaseId makes tauri-action upload without editing existing release notes.
      - name: Locate the existing release
        id: target-release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" --jq '.id')"
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Build and upload installers to the prerelease
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign). The key has no password; the
          # empty PASSWORD var keeps the CLI from prompting interactively.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          # Public installers ask users for their own deployed server.
          SSHELTER_RELAY_URL: ""
        with:
          # The prerelease already exists (created by `prepare`); upload assets by ID without editing its metadata.
          releaseId: ${{ steps.target-release.outputs.id }}
          tagName: ${{ needs.prepare.outputs.tag_name }}
          # Retain beta intent; releaseId also preserves the existing prerelease metadata.
          prerelease: true
          tauriScript: ${{ startsWith(matrix.platform, 'macos') && 'bash scripts/build-macos-release.sh' || '' }}
          args: ${{ matrix.args }}

      - name: Remove the temporary macOS signing keychain
        if: always() && startsWith(matrix.platform, 'macos')
        run: bash scripts/macos-signing.sh cleanup

  beta-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared with release.yml: manifest updates queue instead of racing.
    concurrency:
      group: updater-beta-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Update the Beta channel manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: node scripts/beta-channel.mjs update-manifest "$TAG_NAME"
